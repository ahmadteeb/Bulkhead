name: Build Windows Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install Pub dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
            VERSION="${VERSION%%+*}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUM=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_ENV"

      - name: Build Windows Desktop Release
        shell: pwsh
        run: |
          flutter build windows --release --build-name=$env:VERSION --build-number=$env:BUILD_NUM

      - name: Package Windows Desktop Bundle (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "build/windows/x64/runner/Release") {
            Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "release/bulkhead-windows-x64.zip"
          } elseif (Test-Path "build/windows/runner/Release") {
            Compress-Archive -Path "build/windows/runner/Release/*" -DestinationPath "release/bulkhead-windows-x64.zip"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulkhead-windows-packages
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

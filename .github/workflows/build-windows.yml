name: Build Windows Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install Pub dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Desktop Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "release/bulkhead-windows-x64.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulkhead-windows-packages
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Linux Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libglib2.0-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install Pub dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Desktop Bundle
        run: |
          mkdir -p release
          cd build/linux/x64/release/bundle
          zip -r ../../../../../release/bulkhead-linux-x64.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulkhead-linux-x64
          path: release/bulkhead-linux-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/bulkhead-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

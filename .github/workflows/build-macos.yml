name: Build macOS Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install Pub dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
            VERSION="${VERSION%%+*}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUM=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_ENV"

      - name: Build macOS Desktop Release
        run: |
          flutter build macos --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: Package macOS App Bundle (.dmg & .zip)
        run: |
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          PRODUCTS_DIR="$GITHUB_WORKSPACE/build/macos/Build/Products/Release"
          mkdir -p "$RELEASE_DIR"

          if [ -d "$PRODUCTS_DIR/Bulkhead.app" ]; then
            APP_NAME="Bulkhead.app"
          elif [ -d "$PRODUCTS_DIR/bulkhead.app" ]; then
            APP_NAME="bulkhead.app"
          else
            echo "No macOS app bundle found in $PRODUCTS_DIR" >&2
            exit 1
          fi

          (cd "$PRODUCTS_DIR" && zip -r -y "$RELEASE_DIR/bulkhead-macos-app.zip" "$APP_NAME")
          hdiutil create -volname Bulkhead -srcfolder "$PRODUCTS_DIR/$APP_NAME" -ov -format UDZO "$RELEASE_DIR/bulkhead-macos-${VERSION}.dmg"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulkhead-macos-packages
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
